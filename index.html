<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CertiPlan</title></head><body style="margin:0;background:#052a4d"><script>(async()=>{try{let s='';for(let i=0;i<6;i++){const r=await fetch(`payload/p${i}.txt?v=1`);if(!r.ok)throw new Error(`payload ${i} failed`);s+=(await r.text()).trim()}const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(txt);document.close()}catch(e){document.body.innerHTML='<pre style="color:white;padding:20px;font-family:sans-serif">Unable to load site: '+e.message+'</pre>'}})()</script></body></html>
